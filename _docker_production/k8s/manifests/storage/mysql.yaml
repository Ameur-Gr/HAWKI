apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - "--max_connections=2000"
          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hawki-secrets
                  key: DB_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              value: hawki1

            - name: MYSQL_USER
              value: hawki1

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hawki-secrets
                  key: DB_PASSWORD

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data