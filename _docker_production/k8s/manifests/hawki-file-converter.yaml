apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-converter
  template:
    metadata:
      labels:
        app: file-converter
    spec:
      automountServiceAccountToken: false
      containers:
        - name: file-converter
          image: digitalenvironments/hawki-toolkit-file-converter:3.0.1
          ports:
            - containerPort: 80
          env:
            - name: F_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hawki-secrets
                  key: HAWKI_FILE_CONVERTER_API_KEY

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: file-converter
spec:
  selector:
    app: file-converter
  ports:
    - port: 80
      targetPort: 80