apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling-serve
  namespace: hawki2-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docling-serve
  template:
    metadata:
      labels:
        app: docling-serve
    spec:
      containers:
        - name: docling
          image: quay.io/docling-project/docling-serve-cpu:v1.37.0
          ports:
            - containerPort: 5001
          env:
            - name: DOCLING_SERVE_ENABLE_API_DOCS
              value: "true"
            - name: DOCLING_SERVE_LOG_LEVEL
              value: "INFO"
            - name: DOCLING_SERVE_MAX_SYNC_WAIT
              value: "900"
            - name: DOCLING_DEBUG_PROFILE_PIPELINE_TIMINGS
              value: "true"
            - name: DOCLING_NUM_THREADS
              value: "8"
          resources:
            requests:
              cpu: "24"
              memory: "32Gi"
            limits:
              cpu: "32"
              memory: "64Gi" 

---
apiVersion: v1
kind: Service
metadata:
  name: docling-serve
  namespace: hawki2-ns
spec:
  selector:
    app: docling-serve
  ports:
    - port: 5001
      targetPort: 5001