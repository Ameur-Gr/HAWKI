apiVersion: v1
kind: ConfigMap
metadata:
  name: hawki-config
  namespace: hawki2-ns
data:
  APP_NAME: "Blablador"
  PROJECT_NAME: "hawki2"

  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_TIMEZONE: "CET"
  APP_LOCALE: "en_US"
  APP_FALLBACK_LOCALE: "de_DE"
  ENVIRONMENT: "production"
  # APP_URL: "https://test-c.blablador.fz-juelich.de"

  APP_MAINTENANCE_DRIVER: "cache"
  APP_MAINTENANCE_STORE: "database"

  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: "/"
  SESSION_DOMAIN: "null"
  SESSION_EXPIRE_ON_CLOSE: "true"

  AI_MENTION_HANDLE: "Blablador"
  HAWKI_NAME: "Blablador"
  HAWKI_USERNAME: "Blablador"
  HAWKI_AVATAR: "blablador-icon.svg"

  APP_SECURITY_PASSKEY_ALLOW_PASTE: "true"
  APP_SECURITY_PASSKEY_CHAR_LIMITATION: "true"

  # AI
  OPENAI_ACTIVE: "false"
  BLABLADOR_ACTIVE: "true"
  BLABLADOR_API_URL: "http://llmstack-router-service.default.svc.cluster.local/v1"
  BLABLADOR_PING_URL: "http://llmstack-router-service.default.svc.cluster.local/v1/models"

  DEFAULT_MODEL: "alias-fast"
  DEFAULT_WEBSEARCH_MODEL: "alias-huge"
  DEFAULT_FILEUPLOAD_MODEL: "alias-fast"
  DEFAULT_VISION_MODEL: "alias-huge"

  TITLE_GENERATOR_MODEL: "alias-fast"
  PROMPT_IMPROVEMENT_MODEL: "alias-fast"
  SUMMARIZER_MODEL: "alias-fast"
  
  # Database
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_DATABASE: "hawki1"
  DB_USERNAME: "hawki1"

  # Filesystem
  FILESYSTEM_DISK: "local"
  STORAGE_DISK: "local_file_storage"
  AVATAR_STORAGE: "public"
  REMOVE_FILES_AFTER_MONTHS: "6"

  # Broadcasting
  BROADCAST_CONNECTION: "reverb"
  BROADCAST_DRIVER: "reverb"

  # Reverb
  REVERB_SERVER_HOST: "0.0.0.0"
  REVERB_SERVER_PORT: "8080"

  REVERB_HOST: "hawki-reverb"
  REVERB_PORT: "8080"
  REVERB_SCHEME: "http"

  REVERB_APP_ID: "hawki"
  REVERB_APP_MAX_MESSAGE_SIZE: "250000"

  # Queue
  QUEUE_CONNECTION: "database"

  # Authentication
  AUTHENTICATION_METHOD: "OIDC"
  TEST_USER_LOGIN: "false"
  OIDC_IDP: "https://login.helmholtz.de/oauth2"
  OIDC_LOGOUT_URI: "https://test-c.blablador.fz-juelich.de/login"
  OIDC_CLIENT_ID: "blablador"
  OIDC_SCOPES: "email,profile"
  OIDC_EMPLOYEETYPE_VAR: "name"

  # External communication
  ALLOW_EXTERNAL_COMMUNICATION: "true"
  ALLOW_USER_TOKEN_CREATION: "true"

  # Cache
  CACHE_STORE: "database"
  CACHE_PREFIX: ""

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  APP_TRUSTED_PROXIES: "*"

  DOCKER_PROJECT_HOST: "hawki-app"
  DOCKER_PROJECT_PROTOCOL: "http"


  APP_PROTOCOL: "https"
  APP_HOST: "test-c.blablador.fz-juelich.de"

  FILE_CONVERTER: "docling"
  DOCLING_API_URL: "http://docling-serve:5001"
  DOCLING_FILE_CONVERTER_TIMEOUT: "240"