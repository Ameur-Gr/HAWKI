apiVersion: v1
kind: ConfigMap
metadata:
  name: hawki-config
  namespace: hawki2-ns
data:
  APP_NAME: "HAWKI2"
  PROJECT_NAME: "hawki2"

  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_TIMEZONE: "CET"
  APP_LOCALE: "de_DE"
  APP_FALLBACK_LOCALE: "en_US"

  APP_URL: "https://REPLACE_WITH_HAWKI_HOST"

  APP_MAINTENANCE_DRIVER: "cache"
  APP_MAINTENANCE_STORE: "database"

  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: "/"
  SESSION_DOMAIN: "null"
  SESSION_EXPIRE_ON_CLOSE: "true"

  AI_MENTION_HANDLE: "hawki"
  HAWKI_NAME: "HAWKI"
  HAWKI_USERNAME: "HAWKI"
  HAWKI_AVATAR: "hawkiAvatar.jpg"

  APP_SECURITY_PASSKEY_ALLOW_PASTE: "true"
  APP_SECURITY_PASSKEY_CHAR_LIMITATION: "true"

  # AI
  OPENAI_ACTIVE: "false"
  BLABLADOR_ACTIVE: "true"
  BLABLADOR_API_URL: "https://api.blablador.fz-juelich.de/v1"
  BLABLADOR_PING_URL: "https://api.blablador.fz-juelich.de/v1/models"

  DEFAULT_MODEL: "alias-fast"
  DEFAULT_WEBSEARCH_MODEL: "alias-huge"
  DEFAULT_FILEUPLOAD_MODEL: "alias-fast"
  DEFAULT_VISION_MODEL: "alias-huge"

  TITLE_GENERATOR_MODEL: "alias-fast"
  PROMPT_IMPROVEMENT_MODEL: "alias-fast"
  SUMMARIZER_MODEL: "alias-fast"

  # File converter
  FILE_CONVERTER: "hawki_converter"
  HAWKI_FILE_CONVERTER_API_URL: "http://hawki-file-converter/extract"

  # Database
  DB_CONNECTION: "mysql"
  DB_HOST: "hawki-mysql"
  DB_PORT: "3306"
  DB_DATABASE: "hawki1"
  DB_USERNAME: "hawki1"

  # Filesystem
  FILESYSTEM_DISK: "local"
  STORAGE_DISK: "local_file_storage"
  AVATAR_STORAGE: "public"
  REMOVE_FILES_AFTER_MONTHS: "6"

  # Broadcasting
  BROADCAST_CONNECTION: "reverb"
  BROADCAST_DRIVER: "reverb"

  # Reverb
  REVERB_SERVER_HOST: "0.0.0.0"
  REVERB_SERVER_PORT: "8080"

  REVERB_HOST: "hawki-reverb"
  REVERB_PORT: "8080"
  REVERB_SCHEME: "http"

  REVERB_APP_ID: "hawki"
  REVERB_APP_MAX_MESSAGE_SIZE: "250000"

  # Queue
  QUEUE_CONNECTION: "database"

  # Authentication
  AUTHENTICATION_METHOD: "LDAP"
  TEST_USER_LOGIN: "true"

  # External communication
  ALLOW_EXTERNAL_COMMUNICATION: "true"
  ALLOW_USER_TOKEN_CREATION: "true"

  # Cache
  CACHE_STORE: "database"
  CACHE_PREFIX: ""

  # Redis
  REDIS_HOST: "hawki-redis"
  REDIS_PORT: "6379"